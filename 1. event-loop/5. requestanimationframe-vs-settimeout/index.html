<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>requestAnimationFrame vs setTimeout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
        background: #020617;
        color: #e5e7eb;
      }
      .box {
        width: 60px;
        height: 60px;
        background: dodgerblue;
        margin-top: 20px;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>requestAnimationFrame vs setTimeout</h1>
    <p>Compare animation smoothness.</p>

    <button id="timeout">Animate with setTimeout</button>
    <button id="raf">Animate with requestAnimationFrame</button>

    <div class="box" id="box"></div>

    <script src="./script.js"></script>
  </body>
</html>
